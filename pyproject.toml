[project]
name = "gt7-race-engineer"
version = "0.1.0"
description = "Fully local, voice-driven AI race engineer for Gran Turismo 7"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycryptodome>=3.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "mlx-whisper>=0.4",
]

[project.scripts]
gt7-engineer = "gt7_engineer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gt7_engineer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
