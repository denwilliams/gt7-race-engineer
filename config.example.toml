# Copy to config.toml (git-ignored). Everything is optional; env GT7_PS_IP overrides ps_ip.
ps_ip = "192.168.1.50"          # PlayStation IP (GT7 > Settings > Network shows it)
stt_model = "mlx-community/whisper-small-mlx"

# Voice. engine: "say" (macOS, robotic) | "qwen3" (Qwen3-TTS 0.6B) | "kokoro" (Kokoro-82M).
# Everything else is optional; each engine has sensible defaults. First run downloads the model.
[tts]
engine = "qwen3"
# voice = "Ryan"        # say: `say -v ?`; kokoro: "am_adam", "af_heart", ...; qwen3: "Ryan", "Vivian", "Serena", ...
# model = "..."         # Hugging Face repo id, to use another size/quantisation
# speed = 1.0           # kokoro speed multiplier; say rate scale; ignored by qwen3
# instruct = "..."      # qwen3 only, leave unset: the 0.6B model does not follow it (and may slow speech); only 1.7B models do

# Any OpenAI-compatible endpoint: LM Studio (:1234), Ollama (:11434/v1), ...
[engineer]
base_url = "http://localhost:1234/v1"
model = "your-chat-model"
# headers = { Authorization = "Bearer ..." }
# reasoning_effort = "none"   # switch off thinking on reasoning models (e.g. gemma4 on Ollama), else replies can come back empty

# Optional: defaults to the [engineer] endpoint
[lap_reviewer]
model = "your-chat-model"

# Optional: decision model for the analysts. Omit it and they use built-in thresholds.
# Hosted Jev via OpenRouter (NOT local: analyst numbers are sent to OpenRouter):
# [decision]
# kind = "jev"
# base_url = "https://openrouter.ai/api/alpha"
# model = "typesafe/jev-1.13"
# api_key_env = "OPENROUTER_API_KEY"
#
# Or any local OpenAI-compatible model answering with one word:
# [decision]
# base_url = "http://localhost:1234/v1"
# model = "your-small-model"
